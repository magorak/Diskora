name: Build a testy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nastavit .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Obnovit závislosti
        run: dotnet restore app/Diskora.slnx

      - name: Sestavit (Release)
        run: dotnet build app/Diskora.slnx --no-restore --configuration Release

      - name: Spustit testy (Release)
        run: dotnet test app/Diskora.slnx --no-build --configuration Release

      - name: Obnovit lokální nástroje (.NET tools manifest)
        run: dotnet tool restore
        working-directory: app

      - name: Vygenerovat SBOM (CycloneDX)
        run: dotnet tool run dotnet-CycloneDX -- Diskora.slnx -o sbom --json
        working-directory: app

      - name: Nahrát SBOM jako artefakt
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: app/sbom/bom.json
